# CodeQL runs the security *and* quality suite here: the quality queries are where "useless assignment",
# "missing Dispose" and "dubious type test of this" come from, and each of those has already found
# something real in this codebase.
#
# Four queries are excluded, for the same reason a Roslyn rule is suppressed where it fires: they are
# wrong for this repository, not merely inconvenient. CodeQL has no in-source suppression for C#, so the
# justification lives here instead of at the call site.
name: "AdCodicem.Pdf"

queries:
  - uses: security-and-quality

query-filters:
  # Flags every call to Path.Combine, unconditionally — the query has no notion of an argument that is
  # known to be relative. The one place a path arrives from outside the repository (a corpus manifest
  # entry, which a private manifest lets a contributor write) is guarded in Corpus.PathOf instead.
  - exclude:
      id: cs/path-combine

  # Catching everything is the point in both places it fires: the fuzzing harness turns an unexpected
  # exception into a failure carrying the input that caused it, and the referee fixture degrades to a
  # skip when no Docker daemon answers. Narrowing either would lose the behaviour under test.
  - exclude:
      id: cs/catch-of-all-exceptions

  # Both loops it flags are inside allocation budgets that the tests then assert on. Rewriting them with
  # Where would allocate an enumerator and a closure, and the measurement would be measuring LINQ.
  - exclude:
      id: cs/linq/missed-where

  # Counts branches and loops per block. A parser is branches and loops; the analysers already enforce
  # complexity at build time, where a finding blocks the build rather than filing an alert.
  - exclude:
      id: cs/complex-block
