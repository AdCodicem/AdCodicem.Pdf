name: Documentation

# The site is published with a stable release, not with every merge, so what is documented online is
# what is released. Called by release.yml; the manual trigger is there for a documentation fix that
# should not wait for the next release.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a queued run supersedes an older one rather than racing it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/website/package-lock.json

      - name: Install
        working-directory: docs/website
        run: npm ci

      - name: Build
        working-directory: docs/website
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/website/build

      - id: deployment
        uses: actions/deploy-pages@v4
