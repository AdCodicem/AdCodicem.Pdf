name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore AdCodicem.Pdf.slnx

      - name: Build
        run: dotnet build AdCodicem.Pdf.slnx -c Release --no-restore

      # Style drift fails the build rather than accumulating as a local warning nobody sees.
      - name: Verify formatting
        run: dotnet format AdCodicem.Pdf.slnx --verify-no-changes --no-restore

      - name: Unit tests
        run: |
          dotnet test --project tests/AdCodicem.Pdf.Tests/AdCodicem.Pdf.Tests.csproj -c Release --no-build \
            -- --coverage --coverage-output-format cobertura --coverage-output coverage.cobertura.xml

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: tests/AdCodicem.Pdf.Tests/bin/Release/net10.0/TestResults/coverage.cobertura.xml
          fail_ci_if_error: false

      - name: Pack
        run: dotnet pack AdCodicem.Pdf.slnx -c Release --no-build -o artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # These run the independent referees — qpdf today, more later — inside containers, so the same
      # versions answer here and on a developer's machine. Docker is present on GitHub runners; where it
      # is not, the tests skip rather than fail.
      - name: Integration tests
        run: dotnet test --project tests/AdCodicem.Pdf.IntegrationTests/AdCodicem.Pdf.IntegrationTests.csproj -c Release

  docs:
    name: Documentation site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/website/package-lock.json

      - name: Install
        working-directory: docs/website
        run: npm ci

      # The site publishes the project's own documents, so a documentation change that does not build is
      # caught here rather than after it reaches the default branch.
      - name: Build
        working-directory: docs/website
        run: npm run build
