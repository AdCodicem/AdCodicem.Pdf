name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # Lets the job exchange a GitHub OIDC token for a short-lived NuGet key; nothing long-lived is
      # stored anywhere. See docs/releasing.md.
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build and test
        run: |
          dotnet build AdCodicem.Pdf.slnx -c Release
          dotnet test --solution AdCodicem.Pdf.slnx -c Release --no-build

      - name: Check the publishing identity is configured
        run: |
          if [ -z "${{ secrets.NUGET_USER }}" ]; then
            echo "::error::The NUGET_USER secret is not set for the 'nuget' environment. It holds the"
            echo "::error::nuget.org account name that owns the trusted publishing policy. See docs/releasing.md."
            exit 1
          fi

      # The key lasts an hour and is single-use to obtain, so it is requested immediately before
      # semantic-release, which may publish within seconds of deciding to.
      - name: Exchange the OIDC token for a short-lived NuGet key
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # Decides the version from the commits, writes the changelog, packs, pushes, tags and releases.
      # No release is produced when no commit since the last tag warrants one.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          npx --yes \
            semantic-release@24 \
            @semantic-release/changelog@6 \
            @semantic-release/exec@6 \
            @semantic-release/git@10
