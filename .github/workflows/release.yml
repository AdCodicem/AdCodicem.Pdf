name: Release

# Two ways out of this repository, in one workflow file because a nuget.org trusted-publishing policy is
# tied to the file name - one policy covers both:
#
#   - every push to main publishes a **preview** package, so what is on main is always installable, and
#     redeploys the site with that preview's documentation beside the stable versions (ADR 31);
#   - a **stable release** cuts the version, changelog, tag, GitHub Release and packages, freezes the
#     documentation of its line, and is never automatic: someone asks for it.
#
# Nothing is tagged or released by merging. That is deliberate: a merge should be cheap.
#
# A manual run does either, and defaults to the harmless one. Publishing a preview needed a merge before,
# which is a poor reason to merge; the stable release is the choice that has to be made deliberately,
# because it tags, writes to main and can never be taken back off nuget.org.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      what:
        description: "What to publish"
        type: choice
        options: [preview, stable]
        default: preview
      dry_run:
        description: "Stable only - work out the version and the notes, then stop; publish and tag nothing"
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

  # The nuget.org account that owns the trusted publishing policy. OIDC proves the run is authorised;
  # this says which account the short-lived key is issued for, which is why NuGet/login requires it even
  # though no credential is involved. It is not one: it is the public owner name already on every page
  # of this repository and on every package it publishes, so it is stated here rather than kept as a
  # secret nobody can see is missing.
  NUGET_ACCOUNT: AdCodicem

# A preview and a stable release must never pack the same commit at the same time.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preview:
    name: Preview package
    # `inputs` is empty on a push, so the second test only ever decides a manual run.
    if: github.event_name == 'push' || inputs.what == 'preview'
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      # Lets the job exchange a GitHub OIDC token for a short-lived NuGet key; nothing long-lived is
      # stored anywhere. See docs/releasing.md.
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, because the preview version is read from the last tag.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Build and test
        run: |
          dotnet build AdCodicem.Pdf.slnx -c Release
          dotnet test --solution AdCodicem.Pdf.slnx -c Release --no-build

      # A preview says where it sits, not what it will be called: one patch above the last release, plus
      # the run number so previews stay ordered. The stable release decides the real number - a feat takes
      # it to the next minor instead - and a preview sorts between the two either way.
      - name: Work out the preview version
        id: version
        run: |
          set -eu
          last="$(git tag --list 'v*' --sort=-v:refname | head -n 1)"
          last="${last#v}"

          if [ -z "$last" ]; then
            # Nothing released yet: there is no baseline to compare the API against either.
            echo "No release tag yet; the preview starts from 0.0.0."
            echo "version=0.0.1-preview.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "baseline=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          major="${last%%.*}"
          rest="${last#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"
          patch="${patch%%[-+]*}"

          # The API is compared with the last release only if a package exists for it: a tag alone is
          # not one, and package validation fails the build on a baseline nuget.org does not have.
          baseline="$(sh .github/scripts/published-baseline.sh "$last")"

          echo "Last release $last; preview one patch above it."
          echo "version=$major.$minor.$((patch + 1))-preview.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"

      # Packed rather than repacked: --no-build would keep the assembly version of the build above, and
      # the package would then disagree with what is inside it.
      - name: Pack
        run: >
          dotnet pack AdCodicem.Pdf.slnx -c Release
          -p:Version=${{ steps.version.outputs.version }}
          -p:PackageValidationBaselineVersion=${{ steps.version.outputs.baseline }}
          -o artifacts

      # The key lasts an hour and is single-use to obtain, so it is requested immediately before the push.
      - name: Exchange the OIDC token for a short-lived NuGet key
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ env.NUGET_ACCOUNT }}

      - name: Push the preview
        run: >
          dotnet nuget push 'artifacts/*.nupkg'
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Say what was published
        run: |
          echo "### Preview \`${{ steps.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Packed from \`${{ github.ref_name }}\` at \`${{ github.sha }}\`." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Published to nuget.org. It is a prerelease, so it reaches only the people who ask for" >> "$GITHUB_STEP_SUMMARY"
          echo "prereleases. Cut the stable release from **Run workflow**, choosing \`stable\`." >> "$GITHUB_STEP_SUMMARY"

  # Every preview published from main puts its documentation online, under /preview beside the stable
  # versions. A preview packed from another branch is for trying out, not for documenting, and the Pages
  # environment deploys from main alone.
  preview-documentation:
    name: Preview documentation
    needs: preview
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      preview_version: ${{ needs.preview.outputs.version }}

  stable:
    name: Stable release
    if: github.event_name == 'workflow_dispatch' && inputs.what == 'stable'
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    outputs:
      commit: ${{ steps.release.outputs.commit }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      # For semantic-release, and for the documentation site, whose user pages the release freezes.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: docs/website/package-lock.json

      - name: Build and test
        run: |
          dotnet build AdCodicem.Pdf.slnx -c Release
          dotnet test --solution AdCodicem.Pdf.slnx -c Release --no-build

      # Not requested on a dry run: the key is single-use to obtain, and a dry run publishes nothing.
      - name: Exchange the OIDC token for a short-lived NuGet key
        id: nuget-login
        if: ${{ !inputs.dry_run }}
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ env.NUGET_ACCOUNT }}

      # Decides the version from the commits, writes the changelog, freezes the documentation of the
      # release's line, packs, pushes, tags and releases. No release is produced when no commit since the
      # last tag warrants one. The commit it ends on is the release commit, which carries the frozen
      # documentation; the site is built from that one, not from the commit this run started from.
      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -eu
          arguments=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            arguments="--dry-run"
          fi

          npx --yes \
            semantic-release@24 \
            @semantic-release/changelog@6 \
            @semantic-release/exec@6 \
            @semantic-release/git@10 \
            $arguments

          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # With no preview newer than the release, the redeployed site has no preview section until the next
  # merge publishes one.
  documentation:
    name: Documentation
    needs: stable
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.what == 'stable' && !inputs.dry_run }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ needs.stable.outputs.commit }}
