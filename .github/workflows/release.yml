name: Release

# Cutting a stable release is a deliberate act, not a consequence of merging. Previews go out weekly when a
# package input changed (preview.yml, ADR 49); this workflow is the moment a human decides those changes are a
# release. Pushing to nuget.org cannot be undone: a package can be unlisted, never withdrawn.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Work out the version and the notes, then stop; publish and tag nothing"
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

  # The nuget.org account that owns the trusted publishing policy. OIDC proves the run is authorized;
  # this says which account the short-lived key is issued for, which is why NuGet/login requires it even
  # though no credential is involved. It is not one: it is the public owner name already on every page
  # of this repository and on every package it publishes, so it is stated here rather than kept as a
  # secret nobody can see is missing.
  NUGET_ACCOUNT: AdCodicem

# One release at a time.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  stable:
    name: Stable release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nuget
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      # For semantic-release, and for the documentation site, whose user pages the release freezes.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs/website/package-lock.json

      # semantic-release and its plugins at the versions package-lock.json pins. Nothing it installs
      # declares an install script, and none runs in the job that holds the publishing key.
      - name: Install release tooling
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build and test
        run: |
          dotnet build AdCodicem.Pdf.slnx -c Release
          dotnet test --solution AdCodicem.Pdf.slnx -c Release --no-build

      # Not requested on a dry run: the key is single-use to obtain, and a dry run publishes nothing.
      - name: Exchange the OIDC token for a short-lived NuGet key
        id: nuget-login
        if: ${{ !inputs.dry_run }}
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ env.NUGET_ACCOUNT }}

      # Decides the version from the commits, writes the changelog, freezes the documentation of the
      # release's line, packs, pushes, tags and releases. No release is produced when no commit since the
      # last tag warrants one. The commit it ends on is the release commit, which carries the frozen
      # documentation; the site is built from that one, not from the commit this run started from.
      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          arguments=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            arguments="--dry-run"
          fi

          npx --no-install semantic-release $arguments

          # semantic-release commits the changelog and the frozen documentation, then tags that commit: when
          # HEAD has moved off the dispatched commit, the stable tag at HEAD is the release to document.
          tag=""
          if [[ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            tag="$(git tag --points-at HEAD --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)"
          fi
          echo "Released tag: ${tag:-none}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  # The new snapshot only exists in the release commit, and the workflow was dispatched from the commit before
  # it, so the build is pointed at the tag: without it the site would be rebuilt without the version just
  # released, and without a preview section, which a stable label hides.
  documentation:
    name: Documentation
    needs: stable
    if: ${{ !inputs.dry_run && needs.stable.outputs.tag != '' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ needs.stable.outputs.tag }}
      preview-version: ${{ needs.stable.outputs.version }}
