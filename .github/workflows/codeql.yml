name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a rule added upstream reaches this repository without a push.
    - cron: "41 4 * * 1"

permissions:
  contents: read

jobs:
  analyse:
    name: Analyse C#
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          config-file: ./.github/codeql/codeql-config.yml

      # Built explicitly rather than by autobuild: the SDK is pinned in global.json and the solution is
      # an .slnx, which autobuild does not reliably pick up.
      - name: Build
        run: dotnet build AdCodicem.Pdf.slnx -c Release

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:csharp"
