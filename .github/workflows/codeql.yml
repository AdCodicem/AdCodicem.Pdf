name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a rule added upstream reaches this repository without a push.
    - cron: "41 4 * * 1"

permissions:
  contents: read

jobs:
  analyse:
    name: Analyse C#
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - uses: github/codeql-action/init@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3.38.1
        with:
          languages: csharp
          config-file: ./.github/codeql/codeql-config.yml

      # Built explicitly rather than by autobuild: the SDK is pinned in global.json and the solution is
      # an .slnx, which autobuild does not reliably pick up.
      - name: Build
        run: dotnet build AdCodicem.Pdf.slnx -c Release

      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:csharp"
