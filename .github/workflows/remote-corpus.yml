name: Remote corpus

# Documents we may use in tests but not redistribute - bug-report attachments, vendors' samples, ShareAlike
# sets, files too large to commit - are described in tests/corpus/remote.json and fetched here, never
# committed (ADR 32). This is the only job that meets them, and the only one that depends on the network.
on:
  schedule:
    # Every night, after the fuzzing campaign.
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  remote:
    name: Acceptance over the remote corpus
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      # Every file is checked against the SHA-256 the manifest pins, and one that changed at its source is
      # refused. A document that cannot be had must not look like a failing test, nor stop the others from
      # being tested: the step carries on, and the last step reports it for what it is.
      - name: Fetch the remote corpus
        id: fetch
        continue-on-error: true
        run: python3 tests/corpus/build/fetch_remote.py

      # The suite merges the remote entries whose file is present, so the acceptance conditions run over
      # every document fetched - and their derived variants, if any, are made here and discarded with the job.
      - name: Acceptance tests
        run: dotnet test --project tests/AdCodicem.Pdf.Tests/AdCodicem.Pdf.Tests.csproj -c Release

      - name: Referee checks
        run: dotnet test --project tests/AdCodicem.Pdf.IntegrationTests/AdCodicem.Pdf.IntegrationTests.csproj -c Release

      - name: Report documents that could not be fetched
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error title=Remote corpus::Some remote documents are unavailable or no longer match their pinned SHA-256. The tests above ran without them; the fetch step and the job summary name them. A changed file is a new document: review it, never update its hash to make this pass."
          exit 1
