name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "26 5 * * 2"
  push:
    branches: [main]
  # Asking for a report on demand, rather than waiting for the weekly run. The action refuses any ref
  # other than the default branch, so a manual run has to be started on `main`.
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Supply-chain health
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Pinned to a released version rather than a floating major: this action publishes no `v2` tag, and
      # an unresolvable ref fails the run before any step starts — which is what it did on every run from
      # the day this workflow was added. An exact version is also something Dependabot can see and bump.
      - uses: ossf/scorecard-action@v2.4.4
        id: scorecard
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes the result so the README badge has something to read, and so anyone depending on
          # this package can check its supply-chain posture without asking.
          publish_results: true

      - uses: actions/upload-artifact@v7
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
