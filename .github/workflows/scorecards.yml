name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "26 5 * * 2"
  push:
    branches: [main]
  # Asking for a report on demand, rather than waiting for the weekly run. The action refuses any ref
  # other than the default branch, so a manual run has to be started on `main`.
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Supply-chain health
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This action publishes no floating `v2` tag, and an unresolvable ref fails the run before any
      # step starts — which is what it did on every run from the day this workflow was added. It is now
      # pinned by commit hash like every other action here; the trailing comment is what Dependabot
      # reads to know which version that hash is, and what it rewrites when it bumps one.
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        id: scorecard
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes the result so the README badge has something to read, and so anyone depending on
          # this package can check its supply-chain posture without asking.
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
