name: Comparison benchmarks

on:
  workflow_dispatch:
    inputs:
      filter:
        description: "BenchmarkDotNet filter"
        required: false
        default: "*"
      job:
        description: "BenchmarkDotNet job: Short for a quick look, Default for figures worth publishing"
        required: false
        default: "Default"
        type: choice
        options:
          - Default
          - Short

permissions:
  contents: read

# Measures this library against PdfPig, PDFsharp and iText on the same corpus documents. Deliberately not on
# push, like the Benchmarks workflow: the figures the comparison page publishes cite one run of this workflow,
# by number, with its runner, its date and the versions it measured, so anyone can run it again.
jobs:
  compare:
    name: Run comparison benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Run
        run: |
          dotnet run -c Release --project benchmarks/AdCodicem.Pdf.Benchmarks.Comparison -- \
            --filter '${{ github.event.inputs.filter || '*' }}' --job '${{ github.event.inputs.job || 'Default' }}' \
            --memory --exporters json markdown

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: comparison-benchmark-results
          path: BenchmarkDotNet.Artifacts/results/*
          if-no-files-found: error
