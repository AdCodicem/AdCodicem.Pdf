name: Commits

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  conventional:
    name: Conventional commits
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Not a style check. Versions and release notes are computed from these messages, so a malformed
      # one does not merely look untidy - it silently produces no release.
      - uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.mjs
