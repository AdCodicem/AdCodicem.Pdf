name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      filter:
        description: "BenchmarkDotNet filter"
        required: false
        default: "*"

permissions:
  contents: read

# Deliberately not on push: shared runners are noisy, and a number measured on one is worth less than the
# time it takes to produce. Run this before a release, or locally when a change should have moved a figure.
jobs:
  benchmark:
    name: Run benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Run
        run: |
          dotnet run -c Release --project benchmarks/AdCodicem.Pdf.Benchmarks -- \
            --filter '${{ github.event.inputs.filter || '*' }}' --exporters json markdown

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-results
          path: BenchmarkDotNet.Artifacts/results/*
          if-no-files-found: warn
