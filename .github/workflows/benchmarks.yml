name: Benchmarks

on:
  workflow_dispatch:
    inputs:
      filter:
        description: "BenchmarkDotNet filter"
        required: false
        default: "*"

permissions:
  contents: read

# Deliberately not on push: shared runners are noisy, and a number measured on one is worth less than the
# time it takes to produce. Run this before a release, or locally when a change should have moved a figure.
jobs:
  benchmark:
    name: Run benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Run
        run: |
          dotnet run -c Release --project benchmarks/AdCodicem.Pdf.Benchmarks -- \
            --filter '${{ github.event.inputs.filter || '*' }}' --exporters json markdown

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results
          path: BenchmarkDotNet.Artifacts/results/*
          if-no-files-found: warn
