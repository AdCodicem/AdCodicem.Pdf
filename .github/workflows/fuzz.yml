name: Fuzzing

on:
  schedule:
    # Every night. A campaign this size is too slow for every commit and too valuable to run by hand.
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      iterations:
        description: "Mutations per seed document"
        required: false
        default: "20000"
      cases:
        description: "Generated cases per property"
        required: false
        default: "50000"
      rotation:
        description: "Which share of the seed documents beyond the core to fuzz: a number, or 'all' for every one (default: the run number)"
        required: false
        default: ""

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  fuzz:
    name: Mutation and property campaign
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      # Seeded mutations of the corpus: a failure names the document and the seed, so it replays exactly.
      # Each night fuzzes the smallest document of every reader structure and a share of the others chosen
      # by the run number, so every seed document is reached within a few nights at a constant cost
      # (FuzzingSeeds). A replay without the rotation includes every seed document.
      - name: Fuzz the reader and the parser
        env:
          ADCODICEM_FUZZ_ITERATIONS: ${{ github.event.inputs.iterations || '20000' }}
          ADCODICEM_FUZZ_ROTATION: ${{ github.event.inputs.rotation || github.run_number }}
        run: |
          dotnet test --project tests/AdCodicem.Pdf.Tests/AdCodicem.Pdf.Tests.csproj -c Release \
            -- --filter-method '*Fuzz*'

      # The properties are fixed-seed in the suite, so a commit can never be failed by luck. Here they are
      # allowed to explore: a different seed each night, over a domain a mutated real document never
      # reaches. A failure still replays from the pair FsCheck prints with the counter-example.
      - name: Check the properties over a wider domain
        env:
          ADCODICEM_PROPERTY_TESTS: ${{ github.event.inputs.cases || '50000' }}
          ADCODICEM_PROPERTY_SEED: ${{ github.run_number }}
        run: |
          dotnet test --project tests/AdCodicem.Pdf.Tests/AdCodicem.Pdf.Tests.csproj -c Release \
            -- --filter-method '*PropertyTests*'
