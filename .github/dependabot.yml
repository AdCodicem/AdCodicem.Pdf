version: 2

updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Minor and patch bumps arrive as one pull request, so the queue stays readable and a major bump
      # stands out as the one that needs a human.
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "build"
      include: scope

  # The release tooling: semantic-release and the plugins .releaserc.json names (ADR 48).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "build"
      include: scope

  - package-ecosystem: npm
    directory: "/docs/website"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "build"
      include: scope

  # "/" covers .github/workflows; the composite action the workflows share (.github/actions/build-site) is
  # pinned the same way and listed apart.
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
      day: monday
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "build"
